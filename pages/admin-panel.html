<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Panel – AgroTECH</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body { background: #f1f5f2; }
    .admin-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar { background: #072710; color: white; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { font-size: 22px; font-weight: 800; padding: 8px 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }
    .brand span { color: #69f0ae; }
    .nav-section-label { font-size: 11px; font-weight: 700; color: #81c784; text-transform: uppercase; letter-spacing: 0.6px; padding: 12px 14px 4px; }
    .side-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; color: #d9eadc; padding: 10px 14px; border-radius: 10px; margin: 3px 0; cursor: pointer; font-size: 13.5px; transition: all 0.2s; }
    .side-btn:hover, .side-btn.active { background: #1b5e20; color: white; font-weight: 600; }
    .logout { margin-top: 18px; background: #7f1d1d; color: white; }
    .logout:hover { background: #991b1b; }
    .main { padding: 25px 32px; max-width: 1400px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .top h1 { margin: 0; font-size: 1.6rem; color: #0b3d14; }
    .admin-user { background: white; padding: 8px 16px; border-radius: 12px; border: 1px solid #e3e8e4; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media(max-width:1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width:700px) { .grid-4, .grid-2 { grid-template-columns: 1fr; } }

    .stat { background: white; border: 1px solid #e2e8e3; border-radius: 16px; padding: 18px; box-shadow: var(--shadow-sm); }
    .stat small { color: #64748b; font-size: 0.8rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.4px; }
    .stat strong { display: block; font-size: 28px; margin-top: 6px; color: #145a1c; font-family: 'Sora', sans-serif; }
    
    .panel { background: white; border: 1px solid #e2e8e3; border-radius: 16px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .panel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .panel h2 { margin: 0; font-size: 1.25rem; color: #0f3d17; }
    
    .table-wrap { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; }
    .table th { background: #f8faf9; font-weight: 700; color: #475569; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px; border-bottom: 2px solid #e2e8e0; text-align: left; }
    .table td { padding: 12px; border-bottom: 1px solid #edf0ee; font-size: 14px; color: #334155; }
    .table tr:hover { background: #f9fbf9; }
    
    .pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-block; }
    .pill-active { background: #e8f5e9; color: #1b5e20; }
    .pill-blocked { background: #fee2e2; color: #b91c1c; }
    .pill-pending { background: #fff8e1; color: #b45309; }
    
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini { border: 0; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
    .approve { background: #e8f5e9; color: #1b5e20; }
    .approve:hover { background: #c8e6c9; }
    .reject { background: #fee2e2; color: #b91c1c; }
    .reject:hover { background: #fecaca; }
    
    .search-input { width: 100%; padding: 10px 14px; border: 1.5px solid #dfe6e1; border-radius: 10px; font-size: 14px; margin-bottom: 14px; }
    .sub-filter-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .sub-tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid #cbd5e1; background: white; color: #475569; }
    .sub-tab.active { background: #1b5e20; color: white; border-color: #1b5e20; }

    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }
    @media print {
      .sidebar, .dashboard-actions, .actions, .search-input, .sub-filter-tabs, button, #langToggleHolder {
        display: none !important;
      }
      .admin-layout {
        display: block !important;
      }
      .main {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .panel, .stat {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
        page-break-inside: avoid;
      }
    }

    @media(max-width:950px) {
      .admin-layout { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: relative; }
      .main { padding: 18px; }
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">🌱 Agro<span>TECH</span> Admin</div>
    
    <button class="side-btn active" onclick="showSection('dashboard', this)">📊 <span data-i18n="nav.admin_dashboard">Dashboard & Analytics</span></button>

    <div class="nav-section-label">USER & ACCOUNT MANAGEMENT</div>
    <button class="side-btn" onclick="showSection('users', this)">👥 <span>All Platform Users</span></button>
    <button class="side-btn" onclick="showSection('farmers', this)">🌾 <span data-i18n="nav.admin_farmers">All Farmers</span></button>
    <button class="side-btn" onclick="showSection('providers', this)">🚜 <span data-i18n="nav.admin_providers">All Providers</span></button>
    <button class="side-btn" onclick="showSection('pending-users', this)">⏳ <span>Pending Registrations</span> <span id="sidePendingBadge" style="margin-left:auto;background:#eab308;color:#000;font-size:11px;font-weight:800;padding:2px 7px;border-radius:10px;display:none">0</span></button>

    <div class="nav-section-label" data-i18n="admin.portal_title">PLATFORM OPERATIONS</div>
    <button class="side-btn" onclick="showSection('services', this)">📋 <span data-i18n="nav.admin_services">Services & Listings</span></button>
    <button class="side-btn" onclick="showSection('requests', this)">📦 <span data-i18n="nav.admin_requests">Service Requests</span></button>
    <button class="side-btn" onclick="showSection('alerts', this)">🔔 <span data-i18n="nav.admin_alerts">Broadcast & Alerts</span></button>
    <button class="side-btn" onclick="showSection('complaints', this)">⚠️ <span data-i18n="nav.admin_complaints">Complaints & Support</span> <span id="sideComplaintBadge" style="margin-left:auto;background:#ef4444;color:white;font-size:11px;font-weight:800;padding:2px 7px;border-radius:10px;display:none">0</span></button>
    <button class="side-btn" onclick="showSection('settings', this)">⚙️ <span data-i18n="nav.admin_settings">Settings & Security</span></button>
    
    <button class="side-btn logout" onclick="adminLogout()">🚪 <span data-i18n="nav.logout">Logout</span></button>
  </aside>

  <!-- Main View -->
  <main class="main">
    <div class="top">
      <div>
        <h1 id="title" data-i18n="admin.portal_title">Admin Dashboard & Analytics</h1>
        <p style="color:#64748b;margin:4px 0" data-i18n="admin.portal_subtitle">Complete overview of Farmers, Providers, Services, Requests & Analytics</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="langToggleHolder"></div>
        <div class="admin-user">🛡️ <span id="adminName">Administrator</span></div>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="global-toast" class="toast"></div>
<script src="../js/i18n.js"></script>
<script src="../js/api.js"></script>
<script src="../js/global.js"></script>
<script>
let currentSection = 'dashboard';
let cache = {};

document.addEventListener('DOMContentLoaded', async () => {
  const holder = document.getElementById('langToggleHolder');
  if (holder && typeof AgroI18n !== 'undefined') {
    holder.innerHTML = AgroI18n.renderLanguageToggle();
  }

  if (!localStorage.getItem('agro_token')) {
    location.href = 'admin-login.html';
    return;
  }
  try {
    const m = await apiRequest('/auth/me');
    if (m.user.role !== 'admin') {
      showToast('Admin privileges required', 'error');
      setTimeout(() => location.href = 'admin-login.html', 800);
      return;
    }
    document.getElementById('adminName').textContent = m.user.name || 'Administrator';
    updateAdminSidebarBadges();
    await showSection('dashboard', document.querySelector('.side-btn.active'));
  } catch (e) {
    clearSession();
    location.href = 'admin-login.html';
  }
});

async function updateAdminSidebarBadges() {
  try {
    const res = await apiRequest('/admin/complaints');
    const openCount = (res.complaints || []).filter(c => c.status !== 'resolved').length;
    const badge = document.getElementById('sideComplaintBadge');
    if (badge) {
      if (openCount > 0) {
        badge.textContent = openCount;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }
  } catch (_) {}

  try {
    const pRes = await apiRequest('/admin/pending-users');
    const pCount = (pRes.pending_users || []).length;
    const pBadge = document.getElementById('sidePendingBadge');
    if (pBadge) {
      if (pCount > 0) {
        pBadge.textContent = pCount;
        pBadge.style.display = 'inline-block';
      } else {
        pBadge.style.display = 'none';
      }
    }
  } catch (_) {}
}

async function showSection(sec, btn) {
  currentSection = sec;
  document.querySelectorAll('.side-btn').forEach(x => x.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
  } else {
    // If opened programmatically, activate matching sidebar button
    const targetSec = (sec === 'reports') ? 'dashboard' : sec;
    const matchingBtn = Array.from(document.querySelectorAll('.side-btn')).find(b => {
      const onclickAttr = b.getAttribute('onclick') || '';
      return onclickAttr.includes(`'${targetSec}'`) || onclickAttr.includes(`"${targetSec}"`);
    });
    if (matchingBtn) matchingBtn.classList.add('active');
  }

  const titles = {
    dashboard: AgroI18n.get('admin.portal_title', 'Admin Dashboard & Analytics'),
    reports: AgroI18n.get('admin.portal_title', 'Admin Dashboard & Analytics'),
    users: 'All Platform Users & Accounts',
    'pending-users': 'Pending Registrations (Awaiting OTP / Activation)',
    farmers: AgroI18n.get('nav.admin_farmers', 'Farmer Management'),
    providers: AgroI18n.get('nav.admin_providers', 'Provider Management'),
    services: AgroI18n.get('nav.admin_services', 'Services & Listings'),
    requests: AgroI18n.get('nav.admin_requests', 'Service Requests & Orders'),
    alerts: AgroI18n.get('nav.admin_alerts', 'Broadcast Announcements'),
    complaints: AgroI18n.get('nav.admin_complaints', 'Complaints & Support'),
    settings: AgroI18n.get('nav.admin_settings', 'Admin Settings')
  };
  document.getElementById('title').textContent = titles[sec] || 'Admin Control';

  const c = document.getElementById('content');
  c.innerHTML = '<div class="panel">Loading section data...</div>';

  try {
    if (sec === 'dashboard' || sec === 'reports') {
      c.innerHTML = await dashboardView();
      if (sec === 'reports') {
        setTimeout(() => {
          const el = document.getElementById('analyticsReportSection');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 150);
      }
    }
    if (sec === 'users') c.innerHTML = await usersView();
    if (sec === 'pending-users') c.innerHTML = await pendingUsersView();
    if (sec === 'farmers') c.innerHTML = await farmersView();
    if (sec === 'providers') c.innerHTML = await providersView();
    if (sec === 'services') c.innerHTML = await servicesView();
    if (sec === 'requests') c.innerHTML = await requestsView();
    if (sec === 'alerts') c.innerHTML = alertsView();
    if (sec === 'complaints') c.innerHTML = await complaintsView();
    if (sec === 'settings') c.innerHTML = settingsView();
  } catch (e) {
    c.innerHTML = `<div class="panel"><h2 style="color:#b91c1c">Error Loading Data</h2><p>${e.message}</p></div>`;
  }
}

// 1. Unified Dashboard & Platform Analytics (Merged with Reports)
async function dashboardView() {
  const [d, reqsRes, svcsRes] = await Promise.all([
    apiRequest('/admin/dashboard').catch(() => ({})),
    apiRequest('/admin/requests').catch(() => ({ requests: [] })),
    apiRequest('/admin/services').catch(() => ({ services: [] }))
  ]);

  cache.dashboardStats = d;
  const requests = reqsRes.requests || [];
  const services = svcsRes.services || [];
  cache.requests = requests;
  cache.services = services;

  const pendingUsersCount = d.pending_users || 0;
  const totalUsersCount = d.total_users || (Number(d.total_farmers || 0) + Number(d.total_providers || 0)) || 0;
  const openComplaintsCount = d.open_complaints || 0;
  const totalVolume = Number(d.total_volume || d.revenue || 0);
  const totalReqs = d.total_requests || requests.length || 0;
  const completedReqs = d.completed_requests || requests.filter(r => r.status === 'completed').length || 0;
  const pendingReqs = d.pending_requests || requests.filter(r => r.status === 'pending').length || 0;
  const inProgressReqs = requests.filter(r => ['in_progress', 'accepted'].includes(r.status)).length;
  const cancelledReqs = requests.filter(r => ['cancelled', 'rejected'].includes(r.status)).length;

  const completionRate = totalReqs > 0 ? Math.round((completedReqs / totalReqs) * 100) : 0;
  const avgOrderValue = totalReqs > 0 ? Math.round(totalVolume / totalReqs) : 0;

  const farmersCount = d.total_farmers || 0;
  const providersCount = d.total_providers || 0;
  const totalCommunity = (farmersCount + providersCount) || 1;
  const farmerPercent = Math.round((farmersCount / totalCommunity) * 100);
  const providerPercent = 100 - farmerPercent;

  const activeServices = d.active_services || services.filter(s => s.available).length || 0;
  const totalServices = d.total_services || services.length || 0;
  const serviceAvailabilityRate = totalServices > 0 ? Math.round((activeServices / totalServices) * 100) : 100;

  // Category distribution
  const categoryCounts = {};
  services.forEach(s => {
    const rawCat = s.category || 'General';
    const cat = rawCat.charAt(0).toUpperCase() + rawCat.slice(1).toLowerCase();
    categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
  });
  const categoryList = Object.entries(categoryCounts).sort((a, b) => b[1] - a[1]);

  // Recent 5 requests for audit table
  const recentRequests = requests.slice(0, 5);

  return `
    <!-- Top Action & Export Bar -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="display:inline-flex;align-items:center;gap:6px;background:#e8f5e9;color:#166534;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;border:1px solid #bbf7d0">
          <span style="width:8px;height:8px;border-radius:50%;background:#16a34a;display:inline-block;animation:pulse 2s infinite"></span>
          Live Platform Engine
        </span>
        <span style="font-size:12px;color:#64748b">Synced: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
      </div>
      <div class="dashboard-actions" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="mini approve" style="font-size:13px;padding:8px 14px;font-weight:700" onclick="exportPlatformReport()">
          📥 Export Platform Report (CSV)
        </button>
        <button class="mini" style="background:#f1f5f9;color:#334155;font-size:13px;padding:8px 14px;font-weight:700;border:1px solid #cbd5e1" onclick="window.print()">
          🖨️ Print Report
        </button>
        <button class="mini" style="background:#f8fafc;color:#0f3d17;font-size:13px;padding:8px 14px;font-weight:700;border:1px solid #dfe6e1" onclick="showSection('dashboard')">
          🔄 Refresh Metrics
        </button>
      </div>
    </div>

    <!-- Alert Banners -->
    ${pendingUsersCount > 0 ? `
      <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 2px 8px rgba(217,119,6,0.08)">
        <div style="display:flex;align-items:center;gap:14px">
          <span style="font-size:32px">⏳</span>
          <div>
            <strong style="color:#92400e;font-size:15px;display:block">${pendingUsersCount} New User Registration${pendingUsersCount > 1 ? 's' : ''} Awaiting OTP Verification!</strong>
            <span style="color:#b45309;font-size:13px">New users have filled registration forms. You can verify and activate them directly.</span>
          </div>
        </div>
        <button class="mini approve" style="padding:9px 18px;font-size:13px;font-weight:700" onclick="showSection('pending-users')">Review & Activate Now &rarr;</button>
      </div>
    ` : ''}

    ${openComplaintsCount > 0 ? `
      <div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 2px 8px rgba(185,28,28,0.08)">
        <div style="display:flex;align-items:center;gap:14px">
          <span style="font-size:32px">⚠️</span>
          <div>
            <strong style="color:#991b1b;font-size:15px;display:block">${openComplaintsCount} Open Support Ticket${openComplaintsCount > 1 ? 's' : ''} Requiring Resolution!</strong>
            <span style="color:#b91c1c;font-size:13px">Farmers or providers reported issues needing administrative review.</span>
          </div>
        </div>
        <button class="mini reject" style="padding:9px 18px;font-size:13px;font-weight:700" onclick="showSection('complaints')">View Complaints &rarr;</button>
      </div>
    ` : ''}

    <!-- 6 Executive KPI Metric Cards -->
    <div class="grid-4" style="grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));gap:16px;margin-bottom:24px">
      <div class="stat" style="cursor:pointer;transition:transform 0.15s,box-shadow 0.15s" onclick="showSection('users')" title="Click to view all users">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Total Platform Users</small>
          <span style="font-size:18px">👥</span>
        </div>
        <strong>${totalUsersCount}</strong>
        <span style="font-size:12px;color:#16a34a;font-weight:600">🌾 ${farmersCount} Farmers | 🚜 ${providersCount} Providers</span>
      </div>

      <div class="stat" style="cursor:pointer;transition:transform 0.15s,box-shadow 0.15s" onclick="showSection('pending-users')" title="Click to review pending accounts">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Pending Registrations</small>
          <span style="font-size:18px">⏳</span>
        </div>
        <strong style="color:${pendingUsersCount > 0 ? '#d97706' : '#145a1c'}">${pendingUsersCount}</strong>
        <span style="font-size:12px;color:${pendingUsersCount > 0 ? '#b45309' : '#16a34a'};font-weight:600">
          ${pendingUsersCount > 0 ? 'Awaiting Activation &rarr;' : 'All Accounts Verified ✓'}
        </span>
      </div>

      <div class="stat" style="cursor:pointer;transition:transform 0.15s,box-shadow 0.15s" onclick="showSection('services')" title="Click to view services">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Active Services & Equipment</small>
          <span style="font-size:18px">📋</span>
        </div>
        <strong>${activeServices} <span style="font-size:14px;color:#64748b;font-weight:normal">/ ${totalServices}</span></strong>
        <span style="font-size:12px;color:#0284c7;font-weight:600">⚡ ${serviceAvailabilityRate}% Availability Rate</span>
      </div>

      <div class="stat" style="cursor:pointer;transition:transform 0.15s,box-shadow 0.15s" onclick="showSection('requests')" title="Click to view requests">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Gross Platform Volume</small>
          <span style="font-size:18px">💰</span>
        </div>
        <strong style="color:#0f3d17">₹${totalVolume.toLocaleString('en-IN')}</strong>
        <span style="font-size:12px;color:#b45309;font-weight:600">📦 ${totalReqs} Requests (Avg ₹${avgOrderValue.toLocaleString('en-IN')})</span>
      </div>

      <div class="stat" style="cursor:pointer;transition:transform 0.15s,box-shadow 0.15s" onclick="showSection('requests')" title="Click to view requests">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Request Completion Rate</small>
          <span style="font-size:18px">📈</span>
        </div>
        <strong style="color:${completionRate >= 50 ? '#15803d' : '#b45309'}">${completionRate}%</strong>
        <span style="font-size:12px;color:#16a34a;font-weight:600">✅ ${completedReqs} Completed | ⏳ ${pendingReqs} Pending</span>
      </div>

      <div class="stat" style="cursor:pointer;transition:transform 0.15s,box-shadow 0.15s" onclick="showSection('complaints')" title="Click to view support tickets">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Platform Support Tickets</small>
          <span style="font-size:18px">⚠️</span>
        </div>
        <strong style="color:${openComplaintsCount > 0 ? '#b91c1c' : '#15803d'}">${openComplaintsCount}</strong>
        <span style="font-size:12px;color:${openComplaintsCount > 0 ? '#b91c1c' : '#16a34a'};font-weight:600">
          ${openComplaintsCount > 0 ? 'Open Issues Requiring Attention &rarr;' : 'All Tickets Resolved ✓'}
        </span>
      </div>
    </div>

    <!-- Analytics & Reporting Row 1: Community Distribution & Pipeline Fulfillment -->
    <div class="grid-2">
      <!-- Community Breakdown -->
      <div class="panel">
        <div class="panel-top">
          <div>
            <h2>🌾 Farmer & Provider Community Analytics</h2>
            <span style="font-size:12.5px;color:#64748b">Balance ratio between demand (Farmers) and supply (Equipment Providers)</span>
          </div>
          <span class="pill pill-active">Healthy Platform Balance</span>
        </div>
        <div style="background:#f8fafc;padding:18px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13.5px;font-weight:700">
            <span style="color:#15803d">🌾 Farmers: ${farmersCount} (${farmerPercent}%)</span>
            <span style="color:#0369a1">🚜 Providers: ${providersCount} (${providerPercent}%)</span>
          </div>
          <div style="height:14px;border-radius:7px;background:#0284c7;overflow:hidden;display:flex">

async function sendBroadcast() {
  const aud = document.getElementById('broadcastAudience').value;
  const title = document.getElementById('broadcastTitle').value.trim() || 'Platform Announcement';
  const msg = document.getElementById('broadcastMessage').value.trim();
  const btn = document.getElementById('bcastBtn');

  if (!msg) {
    showToast(AgroI18n.get('common.fill_required', 'Please write a message.'), 'error');
    return;
  }
  try {
    btn.disabled = true;
    await apiRequest('/admin/notifications', {
      method: 'POST',
      body: JSON.stringify({ audience: aud, title, message: msg })
    });
    btn.disabled = false;
    showToast('Announcement broadcasted successfully! 📣', 'success');
    document.getElementById('broadcastMessage').value = '';
  } catch (err) {
    btn.disabled = false;
    showToast(err.message, 'error');
  }
}

// Platform Executive Report Exporter
function exportPlatformReport() {
  const d = cache.dashboardStats || {};
  const requests = cache.requests || [];
  const services = cache.services || [];

  const timestamp = new Date().toISOString().replace(/T/, ' ').replace(/\..+/, '');
  let csv = `AgroTech Platform Executive Report & Analytics\n`;
  csv += `Generated On,${timestamp}\n\n`;

  csv += `=== EXECUTIVE KPI SUMMARY ===\n`;
  csv += `Metric,Value\n`;
  csv += `Total Platform Users,${d.total_users || 0}\n`;
  csv += `Total Registered Farmers,${d.total_farmers || 0}\n`;
  csv += `Active Farmers,${d.active_farmers || 0}\n`;
  csv += `Total Registered Providers,${d.total_providers || 0}\n`;
  csv += `Active Providers,${d.active_providers || 0}\n`;
  csv += `Pending Registrations,${d.pending_users || 0}\n`;
  csv += `Total Services Cataloged,${d.total_services || services.length || 0}\n`;
  csv += `Active Available Services,${d.active_services || 0}\n`;
  csv += `Total Service Requests,${d.total_requests || requests.length || 0}\n`;
  csv += `Completed Requests,${d.completed_requests || 0}\n`;
  csv += `Pending Requests,${d.pending_requests || 0}\n`;
  csv += `Gross Transaction Volume (INR),${d.total_volume || 0}\n`;
  csv += `Total Support Tickets,${d.total_complaints || 0}\n`;
  csv += `Open Support Complaints,${d.open_complaints || 0}\n\n`;

  if (requests.length > 0) {
    csv += `=== RECENT SERVICE ORDERS AUDIT ===\n`;
    csv += `Order ID,Farmer Name,Provider Name,Service Name,Price (INR),Status,Date\n`;
    requests.forEach(r => {
      const orderId = r.request_id || r.order_id || r.id;
      const farmer = (r.farmer?.name || r.farmer_name || 'Farmer').replace(/,/g, ' ');
      const provider = (r.provider?.name || 'Provider').replace(/,/g, ' ');
      const svc = (r.service_name || r.product_name || 'Service').replace(/,/g, ' ');
      const price = r.price || 0;
      const status = r.status || 'pending';
      const date = r.created_at || '';
      csv += `"${orderId}","${farmer}","${provider}","${svc}",${price},"${status}","${date}"\n`;
    });
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().split('T')[0];
  a.href = url;
  a.download = `AgroTech_Executive_Platform_Report_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Platform Report exported successfully! 📥', 'success');
}

function filterUserRole(role, btn) {
  const tabs = btn.parentElement.querySelectorAll('.sub-tab');
  tabs.forEach(b => {
    if (b.textContent.includes('Roles') || b.textContent.includes('Farmers') || b.textContent.includes('Providers') || b.textContent.includes('Admins')) {
      b.classList.remove('active');
    }
  });
  btn.classList.add('active');
  applyUserFilters();
}

function filterUserStatus(status, btn) {
  const tabs = btn.parentElement.querySelectorAll('.sub-tab');
  tabs.forEach(b => {
    if (b.textContent.includes('Statuses') || b.textContent === 'Active' || b.textContent === 'Blocked') {
      b.classList.remove('active');
    }
  });
  btn.classList.add('active');
  applyUserFilters();
}

function applyUserFilters() {
  const activeTabs = Array.from(document.querySelectorAll('.sub-filter-tabs .sub-tab.active'));
  const roleTab = activeTabs.find(b => b.textContent.includes('Roles') || b.textContent.includes('Farmers') || b.textContent.includes('Providers') || b.textContent.includes('Admins'));
  const statusTab = activeTabs.find(b => b.textContent.includes('Statuses') || b.textContent === 'Active' || b.textContent === 'Blocked');

  let targetRole = 'all';
  if (roleTab) {
    if (roleTab.textContent.includes('Farmers')) targetRole = 'farmer';
    else if (roleTab.textContent.includes('Providers')) targetRole = 'provider';
    else if (roleTab.textContent.includes('Admins')) targetRole = 'admin';
  }

  let targetStatus = 'all';
  if (statusTab) {
    if (statusTab.textContent === 'Active') targetStatus = 'active';
    else if (statusTab.textContent === 'Blocked') targetStatus = 'blocked';
  }

  document.querySelectorAll('#usersTable tbody tr').forEach(row => {
    const rRole = (row.getAttribute('data-role') || '').toLowerCase();
    const rStatus = (row.getAttribute('data-status') || '').toLowerCase();
    const roleMatch = (targetRole === 'all') || (targetRole === 'provider' ? ['provider', 'seller'].includes(rRole) : rRole === targetRole);
    const statusMatch = (targetStatus === 'all') || (rStatus === targetStatus);
    row.style.display = (roleMatch && statusMatch) ? '' : 'none';
  });
}

function escapeAttr(str) {
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

async function toggleAdminService(id, available) {
  try {
    await apiRequest(`/admin/services/${id}/status`, { method: 'PUT', body: JSON.stringify({ status: available ? 'active' : 'inactive' }) });
    showToast('Service availability updated.', 'success');
    await showSection('services');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteAdminService(id) {
  if (!confirm('Are you sure you want to remove this service?')) return;
  try {
    await apiRequest(`/admin/services/${id}`, { method: 'DELETE' });
    showToast('Service deleted by admin.', 'success');
    await showSection('services');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function filterTableByQuery(input, tableId) {
  const q = input.value.toLowerCase().trim();
  document.querySelectorAll(`#${tableId} tr`).forEach((row, idx) => {
    if (idx === 0) return;
    row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none';
  });
}
