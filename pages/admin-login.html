<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Login – AgroTECH</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #062b0a, #145a1c, #2e7d32);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .auth { width: min(460px, 100%); }
    .brand { text-align: center; color: white; margin-bottom: 20px; }
    .brand h1 { margin: 8px 0; }
    .brand span { color: #69f0ae; }
    .card {
      background: white;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge-admin {
      display: inline-block;
      background: #e8f5e9;
      color: #1b5e20;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .error {
      display: none;
      background: #ffebee;
      color: #c62828;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }
    .error.show { display: block; }
    .links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .links a {
      color: #2e7d32;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="auth">
    <div class="brand">
      <div style="font-size:44px">🛡️</div>
      <h1>Agro<span>TECH</span></h1>
      <p data-i18n="admin.portal_title">Administrator Portal</p>
    </div>
    <div class="card">
      <div class="card-top">
        <span class="badge-admin" data-i18n="role.badge_admin">ADMIN ACCESS</span>
        <div id="langToggleHolder"></div>
      </div>
      <h2 data-i18n="auth.admin_portal_link">Login as Admin</h2>
      <p style="color:#667085;margin-bottom:1.25rem;font-size:0.875rem" data-i18n="auth.login_subtitle">Use your administrator credentials to access the control panel.</p>
      
      <div id="err" class="error"></div>
      
      <div class="form-group">
        <label class="form-label" data-i18n="auth.username_label">Admin Email / Username</label>
        <input id="email" class="form-input" placeholder="admin@agrotech.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth.password_label">Password</label>
        <input id="password" type="password" class="form-input" placeholder="Enter password" autocomplete="current-password">
      </div>
      
      <button class="btn btn-primary btn-full btn-lg" onclick="loginAdmin()" id="btnSubmit">
        <span data-i18n="auth.login_btn">Login as Admin →</span>
      </button>

      <div style="margin-top:14px;padding:10px 12px;background:#f0fdf4;border:1px dashed #86efac;border-radius:10px;font-size:0.8rem;color:#166534">
        <strong>💡 Quick Admin Test:</strong><br>
        Email: <code style="cursor:pointer;text-decoration:underline" onclick="fillAdmin('admin@agrotech.com','admin123')" title="Click to fill">admin@agrotech.com</code> | Pass: <code>admin123</code>
      </div>

      <div class="links">
        <a href="admin-register.html">Register as Admin</a> · <a href="../index.html">Back to Home</a>
      </div>
    </div>
  </div>

  <div id="global-toast" class="toast"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/global.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const holder = document.getElementById('langToggleHolder');
      if (holder && typeof AgroI18n !== 'undefined') {
        holder.innerHTML = AgroI18n.renderLanguageToggle();
      }
    });

    function fillAdmin(e, p) {
      document.getElementById('email').value = e;
      document.getElementById('password').value = p;
      showToast('Admin credentials filled!', 'info');
    }

    async function loginAdmin() {
      const e = document.getElementById('email').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('err');
      const btn = document.getElementById('btnSubmit');

      if (!e || !p) {
        err.textContent = AgroI18n.get('common.fill_required', 'Please enter email/username and password.');
        err.classList.add('show');
        return;
      }
      try {
        btn.disabled = true;
        await apiAdminLogin(e, p);
        err.classList.remove('show');
        showToast('Admin login successful! 🛡️', 'success');
        setTimeout(() => { location.href = 'admin-panel.html'; }, 600);
      } catch (ex) {
        btn.disabled = false;
        err.textContent = ex.message;
        err.classList.add('show');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loginAdmin();
    });
  </script>
</body>
</html>
